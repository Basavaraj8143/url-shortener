spring.application.name=url-shortener

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:url_shortener}?sslmode=${DB_SSL_MODE:disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=240000

# ── JPA ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:development-secret-change-me-development-secret-change-me}
jwt.expiration-ms=86400000

# Clerk session JWT verification (use your Clerk Frontend API / issuer domain)
clerk.issuer=${CLERK_ISSUER:}
clerk.jwks-url=${CLERK_JWKS_URL:}

# ── Redis ────────────────────────────────────────────────────
# ── Redis ────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── CORS ─────────────────────────────────────────────────────
# Set CORS_ALLOWED_ORIGINS to the exact Vercel frontend origin in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
